lColor=#fff2cc;strokeColor=#d6b656;spacing=8;fontSize=11;size=14;\&quot; value=\&quot;Colecciones (justificacion)&amp;#xa;List (GestorReservas): las reservas se listan en orden de carga y puede haber varias por habitacion o pasajero.&amp;#xa;Set (GestorPasajeros): un pasajero no puede repetirse; equals/hashCode por DNI evita duplicados.&amp;#xa;Map (GestorHabitaciones y GestorUsuarios): busqueda directa por clave (numeroHabitacion y nombreUsuario del personal: Administrador y Conserje) sin recorrer toda la lista.\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;130\&quot; width=\&quot;1100\&quot; x=\&quot;40\&quot; y=\&quot;2763\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;Ju38fYu-G3A_wQ9ISd6V-159\&quot; parent=\&quot;1\&quot; style=\&quot;shape=note;whiteSpace=wrap;align=left;verticalAlign=top;fillColor=#fff2cc;strokeColor=#d6b656;spacing=8;fontSize=11;size=14;\&quot; value=\&quot;Pilares de POO&amp;#xa;Abstraccion: Usuario y Menu (abstractas) + IBajaLogica e ICrud&amp;lt;T&amp;gt;.&amp;#xa;Herencia: Usuario &amp;gt; Administrador / Conserje / Pasajero; Menu &amp;gt; MenuAdministrador / MenuConserje / MenuPasajero.&amp;#xa;Polimorfismo: descripcionRol() en cada tipo de usuario y mostrar() en cada menu.&amp;#xa;Encapsulamiento: atributos privados con getters y setters.&amp;#xa;Enums anidados (dibujados dentro de la caja de su clase): Habitacion.TipoHabitacion, Habitacion.EstadoHabitacion, Reserva.EstadoReserva y Conserje.Turno. MotivoBloqueo es independiente porque lo usan Habitacion y GestorHabitaciones.&amp;#xa;Acceso: Administrador, Conserje y Pasajero (login con nombreUsuario y contrasenia).\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;170\&quot; width=\&quot;1100\&quot; x=\&quot;40\&quot; y=\&quot;2913\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;Ju38fYu-G3A_wQ9ISd6V-160\&quot; parent=\&quot;1\&quot; style=\&quot;shape=note;whiteSpace=wrap;align=left;verticalAlign=top;fillColor=#fff2cc;strokeColor=#d6b656;spacing=8;fontSize=11;size=14;\&quot; value=\&quot;Baja logica, ABMCL y JDBC&amp;#xa;Baja logica: atributo &amp;#39;activo&amp;#39; (IBajaLogica) en Usuario y Habitacion; en Reserva, cancelar() deja estadoReserva = CANCELADA sin borrar el registro.&amp;#xa;ABMCL: ICrud&amp;lt;T&amp;gt; implementado por UsuarioDAO (Administrador y Conserje), PasajeroDAO (Pasajero), HabitacionDAO y ReservaDAO. Los DAO solo tienen los metodos de la interfaz; las busquedas las hacen los gestores sobre sus colecciones. El login busca primero en el personal y despues en GestorPasajeros.&amp;#xa;JDBC: ConexionDB (Singleton) + DAOs. Tablas: Usuario, Administrador, Conserje, Pasajero, Habitacion y Reserva.&amp;#xa;Check-in y check-out se guardan en Reserva (checkIn y checkOut); una reserva con checkIn y sin checkOut es una ocupacion en curso.\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;170\&quot; width=\&quot;1100\&quot; x=\&quot;40\&quot; y=\&quot;3103\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;Ju38fYu-G3A_wQ9ISd6V-161\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;rounded=0;fontSize=16;\&quot; value=\&quot;Text\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;30\&quot; width=\&quot;60\&quot; x=\&quot;1350\&quot; y=\&quot;1120\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n      &lt;/root&gt;\n    &lt;/mxGraphModel&gt;\n  &lt;/diagram&gt;\n&lt;/mxfile&gt;\n&quot;}"></div>
